name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: make -C test report
      - name: Mutation check (tests must catch injected bugs)
        run: test/mutation_check.sh
      - name: Publish results to the job summary
        if: always()
        run: |
          echo "## Test results" >> "$GITHUB_STEP_SUMMARY"
          cat test/build/test-results.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test/build/test-results.md

  esp32-build:
    name: ESP32 firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install "Adafruit SSD1306@2.5.17" "Adafruit GFX Library@1.13.0" "UniversalTelegramBot@1.3.0" "ArduinoJson@7.4.3"
      - name: Compile (fail on any warning from the sketch itself)
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all firmware/IV_Drip_Monitor 2>&1 | tee build.log
          if grep -E "IV_Drip_Monitor\.ino:[0-9]+:[0-9]+: (warning|error)" build.log; then
            echo "::error::warnings in the sketch"; exit 1
          fi
